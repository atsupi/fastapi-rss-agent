name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-format:
    name: Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # uv環境の高速なセットアップ（Node.js 24互換バージョン）
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1. 構文チェックと並び替えを自動修正（--fix）
      - name: Run Ruff Check & Fix
        run: uv run ruff check . --fix

      # 2. コードの見栄え（空行や折り返し）を自動修正
      - name: Run Ruff Format Apply
        run: uv run ruff format .

      # 3. 最後に、完全にクリーンになったか最終確認
      - name: Verify Lint & Format
        run: |
          uv run ruff check .
          uv run ruff format --check .

  test:
    name: Run Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint-and-format # 静的解析がパスした後にテストを実行
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pyproject.tomlに記載された依存関係を完全に同期（キャッシュが自動で効きます）
      - name: Install dependencies
        run: uv sync

      # pytestの実行（カレントディレクトリとsrcをインポートパスに含めて実行）
      - name: Run Pytest
        env:
          MODEL_ID: "jp.anthropic.claude-sonnet-4-6"
          # 必要に応じてモック用の環境変数やテスト用AWSリージョンをここに定義
          AWS_DEFAULT_REGION: "ap-northeast-1"
        run: |
          PYTHONPATH=. uv run pytest
